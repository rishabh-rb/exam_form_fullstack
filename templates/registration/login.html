<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <style>
        :root {
            --bg-start: #f5f9ff;
            --bg-end: #eef6f2;
            --card: #ffffff;
            --line: #d7e1ed;
            --text: #18232d;
            --muted: #617181;
            --primary: #1f5fbf;
            --primary-dark: #134996;
            --error: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(130deg, var(--bg-start), var(--bg-end));
        }
        .container {
            width: min(460px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 14px 26px rgba(25, 41, 63, 0.1);
            padding: 24px;
        }
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #e9f2ff;
            color: #184f9e;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        h1 {
            margin: 12px 0 6px;
            font-size: 27px;
        }
        .subtitle {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        form p { margin: 0 0 12px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #c7d4e3;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            background: var(--primary);
            color: #fff;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            opacity: 0.95;
        }
        .error {
            margin-top: 12px;
            border: 1px solid #f5c2c0;
            background: #fff4f3;
            color: var(--error);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">University Exam Portal</span>
        <h1>Student Login</h1>
        <p class="subtitle">Login with credentials provided by admin to access your dashboard and submit exam form details.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}
    </div>
</body>
</html>
